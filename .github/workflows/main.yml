name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack code text file
        run: |
          python3 - <<'PY'
          import re, os, glob
          cands = []
          for src in sorted(glob.glob('*.txt')):
              t = open(src, encoding='utf-8').read()
              if '=== FILE: ' in t:
                  cands.append((src, t))
          if len(cands) == 0:
              print('no code txt file - using repo files as they are')
              raise SystemExit(0)
          if len(cands) > 1:
              names = ', '.join(c[0] for c in cands)
              raise SystemExit('ERROR: ekadhik code txt file pawa gese: ' + names + ' -- shudhu ekta rakho, baki gula delete koro')
          src, t = cands[0]
          t = t.replace('~lt~', '<').replace('~gt~', '>')
          print('unpacking', src)
          os.system('rm -rf lib')
          parts = re.split(r'^=== FILE: (.+?) ===\n', t, flags=re.M)
          for i in range(1, len(parts), 2):
              p = parts[i].strip()
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              open(p, 'w', encoding='utf-8').write(parts[i + 1].strip('\n') + '\n')
              print('  wrote', p)
          PY

      - name: Collect dart files and verify main.dart
        run: |
          mkdir -p lib
          for f in *.dart; do
            if [ -e "$f" ]; then mv "$f" lib/; fi
          done
          if [ ! -f lib/main.dart ]; then
            echo "ERROR: lib/main.dart paoya jay nai. 7ta .dart file lib folder e upload koro."
            exit 1
          fi
          if ! grep -q CheetahApp lib/main.dart; then
            echo "ERROR: lib/main.dart Cheetah er file na. Sothik main.dart upload koro."
            exit 1
          fi

      - name: Check code is not corrupted
        run: |
          python3 - <<'PY'
          import glob, re
          bad = []
          for f in glob.glob('lib/**/*.dart', recursive=True):
              s = open(f, encoding='utf-8').read()
              if re.search(r'Future>|FutureBuilder>|\?\s*>\[', s):
                  bad.append(f)
          if bad:
              raise SystemExit('ERROR: code copy korar somoy < > chinho muche gese in: ' + ', '.join(bad) + ' -- text paste na kore file upload koro')
          print('code ok')
          PY

      - name: Load app.config
        run: |
          set -a; . ./app.config; set +a
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION_BASE.${{ github.run_number }}" >> $GITHUB_ENV
          echo "APK_FILE=${APP_NAME// /_}-v$VERSION_BASE.${{ github.run_number }}.apk" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fixed signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Create Android project
        run: |
          flutter create . --platforms=android --project-name "$PROJECT_NAME" --org "$ORG"
          rm -rf test
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Build APK
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }} \
            --dart-define=TMDB_KEY="$TMDB_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_FILE"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.APP_NAME }} v${{ env.VERSION }}
          files: ${{ env.APK_FILE }}
