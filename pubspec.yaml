name: cheetah_app
description: Cheetah - movie streaming app
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cached_network_image: ^3.3.1
  video_player: ^2.8.0
  dio: ^5.4.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  wakelock_plus: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - app.config

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "logo.png"
